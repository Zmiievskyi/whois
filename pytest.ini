[pytest]
# Pytest configuration for Provider Discovery Tool

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 6.0

# Command line options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/provider_discovery
    --cov-report=html
    --cov-report=term-missing
    --durations=10

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may call external APIs)
    slow: Slow running tests
    dns: DNS related tests
    subdomain: Subdomain enumeration tests
    provider: Provider detection tests
    api: Tests requiring API keys
    mock: Tests using mocked external services
    frontend: Streamlit/UI facing behaviour tests

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */venv*/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
